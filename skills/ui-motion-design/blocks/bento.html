<style>
.b-bento { display: grid; grid-template-columns: repeat(6, 1fr); grid-auto-rows: minmax(210px, auto); gap: 16px; }
.b-bento .t { position: relative; padding: 26px; overflow: hidden; grid-column: span 2; display: flex; flex-direction: column; gap: 6px; }
.b-bento .t.big { grid-column: span 4; grid-row: span 2; } .b-bento .t.wide { grid-column: span 3; }
.b-bento h3 { font-size: 20px; letter-spacing: -0.01em; } .b-bento p { color: var(--muted-foreground); font-size: 16px; }
.b-bento .viz { margin-top: auto; padding-top: 18px; } .b-bento .viz.ph { min-height: 120px; padding: 12px; }
.b-bento .t::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity var(--duration-base);
  background: radial-gradient(420px circle at var(--x, 50%) var(--y, 50%), color-mix(in oklch, var(--primary) 10%, transparent), transparent 45%); }
@media (hover: hover) and (pointer: fine) { .b-bento:hover .t::before { opacity: 1; } }
@media (max-width: 860px) { .b-bento { grid-template-columns: 1fr; } .b-bento .t, .b-bento .t.big, .b-bento .t.wide { grid-column: auto; grid-row: auto; } }
</style>
<section class="block tint" id="leistungen">
  <div class="wrap">
    <div class="head reveal"><span class="kicker">[Funktionen]</span><h2>[Was {{name}} für dich erledigt.]</h2></div>
    <div class="b-bento" data-b-glow>
      <article class="card t big reveal"><h3>[Wichtigstes Feature]</h3><p>[Nutzen in einem Satz, nicht die Technik.]</p><div class="ph viz">[Mini-Visual: UI-Ausschnitt, Gerät, Diagramm]</div></article>
      <article class="card t reveal"><h3>[Feature 2]</h3><p>[Nutzen]</p></article>
      <article class="card t reveal"><h3>[Feature 3]</h3><p>[Nutzen]</p></article>
      <article class="card t wide reveal"><h3>[Feature 4]</h3><p>[Nutzen]</p></article>
      <article class="card t wide reveal"><h3>[Feature 5]</h3><p>[Nutzen]</p></article>
    </div>
  </div>
</section>
<script>
if (matchMedia('(hover: hover) and (pointer: fine)').matches) document.querySelectorAll('[data-b-glow]').forEach((g) => { let ev = null, q = false;
  g.addEventListener('pointermove', (e) => { ev = e; if (q) return; q = true; requestAnimationFrame(() => { q = false; g.querySelectorAll('.t').forEach((t) => { const r = t.getBoundingClientRect(); t.style.setProperty('--x', ev.clientX - r.left + 'px'); t.style.setProperty('--y', ev.clientY - r.top + 'px'); }); }); }); });
</script>
