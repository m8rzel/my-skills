<style>
.b-foot { border-top: 1px solid var(--hair); margin-top: var(--section); padding-block: 48px 120px; font-size: 15px; color: var(--muted-foreground); }
.b-foot .grid { display: grid; grid-template-columns: 2fr repeat(3, 1fr); gap: 28px; }
.b-foot h3 { font: 600 14px/1.3 var(--font-sans); color: var(--foreground); margin-bottom: 8px; }
.b-foot ul { list-style: none; padding: 0; margin: 0; display: grid; }
.b-foot a { text-decoration: none; display: inline-flex; align-items: center; min-height: 44px; } .b-foot a:hover { color: var(--foreground); }
.b-foot .legal { margin-top: 32px; padding-top: 18px; border-top: 1px solid var(--hair); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; font-size: 14px; }
@media (max-width: 760px) { .b-foot .grid { grid-template-columns: 1fr 1fr; } .b-foot .grid > :first-child { grid-column: 1 / -1; } }
</style>
</main>
<footer class="b-foot">
  <div class="wrap">
    <div class="grid">
      <div><a class="b-logo" href="#top"><i aria-hidden="true"></i>{{name}}</a><p style="max-width:34ch;margin-top:8px">[Ein Satz, was {{name}} ist und für wen.]</p></div>
      <div><h3>[Angebot]</h3><ul><li><a href="#leistungen">[Leistungen]</a></li><li><a href="#preise">[Preise]</a></li></ul></div>
      <div><h3>Kontakt</h3><ul><li><a class="num" href="tel:{{phone}}">{{phoneDisplay}}</a></li><li><a href="#kontakt">Anfrage</a></li></ul></div>
      <div><h3>Rechtliches</h3><ul><li><a href="#">Impressum</a></li><li><a href="#">Datenschutz</a></li><li><a href="#">Cookie-Einstellungen</a></li></ul></div>
    </div>
    <div class="legal"><span>© {{year}} {{name}}</span><span>[Standort]</span></div>
  </div>
</footer>
