<style>
.b-mbar { display: none; }
@media (max-width: 860px) {
  .b-mbar { display: flex; position: fixed; inset: auto 0 0; z-index: 45; gap: 8px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
    background: color-mix(in oklch, var(--background) 92%, transparent); backdrop-filter: blur(12px); border-top: 1px solid var(--hair); }
  .b-mbar .btn { flex: 1; padding: 0 12px; font-size: 15px; }
}
@media (prefers-reduced-transparency: reduce) { .b-mbar { background: var(--background); backdrop-filter: none; } }
</style>
<div class="b-mbar" role="region" aria-label="Schnellkontakt"><a class="btn primary" href="#kontakt">{{cta}}</a><a class="btn num" href="tel:{{phone}}">Anrufen</a></div>
