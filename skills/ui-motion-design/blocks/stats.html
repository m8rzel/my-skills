<style>
.b-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 1px; background: var(--hair); border: 1px solid var(--hair); border-radius: var(--radius-xl); overflow: hidden; }
.b-stats div { background: var(--card); padding: 24px; display: grid; gap: 4px; }
.b-stats b { font: 700 clamp(1.8rem, 1.4rem + 1.4vw, 2.6rem)/1.1 var(--font-display); letter-spacing: -0.03em; }
.b-stats span { color: var(--muted-foreground); font-size: 15px; }
</style>
<section class="block">
  <div class="wrap">
    <div class="b-stats reveal">
      <div><b class="num">[1.200+]</b><span>[Zahl mit Kontext]</span></div>
      <div><b class="num">[seit 1998]</b><span>[…]</span></div>
      <div><b class="num">[4,9 ★]</b><span>[…]</span></div>
      <div><b class="num">[24 h]</b><span>[…]</span></div>
    </div>
  </div>
</section>
