<style>
.b-story .grid { display: grid; grid-template-columns: .9fr 1.1fr; gap: clamp(32px, 6vw, 96px); }
.b-story .grid > * { min-width: 0; }
.b-story .stage { position: sticky; top: calc(64px + 8vh); align-self: start; }
.b-story .stage .ph { aspect-ratio: 1; transition: background var(--duration-slow) var(--ease-out); }
.b-story .stage [data-show] { display: grid; place-items: center; height: 100%; }
.b-story .step { min-height: 60vh; display: grid; align-content: center; gap: 12px; padding-left: 22px; border-left: 2px solid var(--hair); transition: border-color var(--duration-slow) var(--ease-out); }
.b-story .step.on { border-left-color: var(--primary); }
.b-story .step h3 { font-size: clamp(1.6rem, 1.2rem + 1.4vw, 2.4rem); line-height: 1.08; letter-spacing: -0.025em; color: color-mix(in oklab, var(--foreground) 62%, var(--background)); transition: color var(--duration-slow); }
.b-story .step.on h3 { color: var(--foreground); }
.b-story .step p { color: var(--muted-foreground); max-width: 46ch; }
.b-story .n { font: 600 13px/1 var(--font-mono); color: var(--accent-text); letter-spacing: .08em; }
@media (max-width: 860px) { .b-story .grid { grid-template-columns: 1fr; } .b-story .stage { top: calc(64px + 2vh); z-index: 2; background: var(--surface); padding-block: 10px; } .b-story .stage .ph { aspect-ratio: 16 / 9; } .b-story .step { min-height: 44vh; } }
</style>
<section class="block tint b-story" id="ablauf">
  <div class="wrap grid">
    <div class="stage"><div class="ph" id="b-story-stage" aria-live="polite">[Visual, das pro Schritt wechselt: Produktzustand, Screenshot, Illustration]</div></div>
    <div>
      <div class="head" style="margin-bottom:0"><span class="kicker">[So funktioniert's]</span><h2>[Die Geschichte in 3–4 Momenten.]</h2></div>
      <article class="step" data-label="[Zustand 1]"><span class="n">01</span><h3>[Moment 1]</h3><p>[Was hier passiert, konkret.]</p></article>
      <article class="step" data-label="[Zustand 2]"><span class="n">02</span><h3>[Moment 2]</h3><p>[…]</p></article>
      <article class="step" data-label="[Zustand 3]"><span class="n">03</span><h3>[Moment 3]</h3><p>[…]</p></article>
      <article class="step" data-label="[Zustand 4]"><span class="n">04</span><h3>[Moment 4]</h3><p>[…]</p></article>
    </div>
  </div>
</section>
<script>
(() => { const stage = document.getElementById('b-story-stage'); const steps = [...document.querySelectorAll('.b-story .step')]; if (!stage || !steps.length) return;
  const io = new IntersectionObserver((es) => { for (const e of es) if (e.isIntersecting) { steps.forEach((s) => s.classList.toggle('on', s === e.target)); stage.dataset.step = steps.indexOf(e.target) + 1; stage.textContent = e.target.dataset.label; } }, { rootMargin: '-45% 0px -45% 0px' });
  steps.forEach((s) => io.observe(s)); })();
</script>
