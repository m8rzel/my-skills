<style>
.b-quote { margin: 0 auto; max-width: 860px; text-align: center; }
.b-quote blockquote { margin: 0; font: 600 clamp(1.4rem, 1.1rem + 1.2vw, 2.1rem)/1.3 var(--font-display); letter-spacing: -0.02em; text-wrap: balance; }
.b-quote figcaption { margin-top: 24px; display: flex; gap: 12px; align-items: center; justify-content: center; font-size: 15px; text-align: left; }
.b-quote .av { width: 46px; height: 46px; border-radius: 50%; background: linear-gradient(135deg in oklch, var(--brand-300), var(--brand-600)); flex: none; }
.b-results { display: flex; gap: 40px; justify-content: center; flex-wrap: wrap; margin-top: 40px; text-align: center; }
.b-results b { display: block; font: 700 34px/1.1 var(--font-display); letter-spacing: -0.03em; } .b-results span { color: var(--muted-foreground); font-size: 14px; }
</style>
<section class="block">
  <div class="wrap">
    <figure class="b-quote reveal">
      <blockquote>„[Konkretes Zitat mit Ergebnis, in den Worten des Kunden.]"</blockquote>
      <figcaption><span class="av" aria-hidden="true"></span><span><b>[Vorname Nachname]</b><br><span class="muted">[Rolle, Firma, Ort]</span></span></figcaption>
    </figure>
    <div class="b-results">
      <div class="reveal"><b class="num">[−9 Tage]</b><span>[Kennzahl 1]</span></div>
      <div class="reveal"><b class="num">[2 h]</b><span>[Kennzahl 2]</span></div>
      <div class="reveal"><b class="num">[0]</b><span>[Kennzahl 3]</span></div>
    </div>
  </div>
</section>
